name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "AOV_HOK_Studio_Android/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build debug APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          elif [ -f ./AOV_HOK_Studio_Android/gradlew ]; then
            cd AOV_HOK_Studio_Android
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper not found. Android project is not present in repository."
            exit 1
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AoV-HOK-Studio-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
