name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "AOV_HOK_Studio_Android_alpha01.zip"
      - ".github/workflows/android-apk.yml"
      - "sm4.py"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up host Python 3.13 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify host Python
        run: |
          python --version
          python3 --version
          python3.13 --version

      - name: Extract Android project
        run: |
          mkdir -p _android_src
          unzip -q AOV_HOK_Studio_Android_alpha01.zip -d _android_src
          PROJECT_DIR="$(find _android_src -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "settings.gradle.kts not found in ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Patch Android Python dependencies
        run: |
          PYTHON_DIR="$PROJECT_DIR/app/src/main/python"
          test -d "$PYTHON_DIR"
          cp sm4.py "$PYTHON_DIR/sm4.py"
          sed -i '/install("sm4==1.0.2")/d' "$PROJECT_DIR/app/build.gradle.kts"
          # Runtime import required by UnityPy_AOV TypeTreeHelper.
          if ! grep -q 'install("tabulate")' "$PROJECT_DIR/app/build.gradle.kts"; then
            sed -i '/install("pycryptodome==3.21.0")/a\            install("tabulate")' "$PROJECT_DIR/app/build.gradle.kts"
          fi
          # Android TextView exposes setSingleLine as a method, not a writable Kotlin property.
          sed -i 's/^[[:space:]]*singleLine = true$/            setSingleLine(true)/' "$PROJECT_DIR/app/src/main/java/com/aov/studio/MainActivity.kt"
          echo "Bundled pure-Python SM4 module:"
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("sm4.py").resolve().parent))
          from sm4 import SM4Key
          key = bytes.fromhex("0123456789abcdeffedcba9876543210")
          plain = bytes.fromhex("0123456789abcdeffedcba9876543210")
          expected = "681edf34d206965e86b3e94f536e4246"
          cipher = SM4Key(key)._block(plain)
          assert cipher.hex() == expected, (cipher.hex(), expected)
          assert SM4Key(key)._block(cipher, True) == plain
          print("SM4 standard known-answer test PASSED")
          PY
          grep -n 'sm4\|pycryptodome' "$PROJECT_DIR/app/build.gradle.kts" || true

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AoV-HOK-Studio-debug-apk
          path: "_android_src/**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
