name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "AOV_HOK_Studio_Android_alpha01.zip"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK without deprecated setup action
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract Android project
        run: |
          mkdir -p _android_src
          unzip -q AOV_HOK_Studio_Android_alpha01.zip -d _android_src
          echo "Project Gradle files:"
          find _android_src -maxdepth 7 \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \) -print

      - name: Build debug APK
        run: |
          WRAPPER="$(find _android_src -type f -name gradlew -print -quit)"
          if [ -z "$WRAPPER" ]; then
            echo "Gradle wrapper not found in uploaded ZIP."
            find _android_src -maxdepth 6 -type f | head -100
            exit 1
          fi
          PROJECT_DIR="$(dirname "$WRAPPER")"
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AoV-HOK-Studio-debug-apk
          path: "_android_src/**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
